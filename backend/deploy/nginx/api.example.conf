server {
    listen 80;
    server_name api.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    root /var/www/ciinlv-pos/backend/public;
    index index.php;
    client_max_body_size 10m;
    server_tokens off;

    # Supply certificates from the approved secret/certificate manager.
    ssl_certificate /etc/ssl/example/api/fullchain.pem;
    ssl_certificate_key /etc/ssl/example/api/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}

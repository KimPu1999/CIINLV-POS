server {
    listen 80;
    server_name admin.example.com shop.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.example.com;
    root /var/www/ciinlv-pos/frontend/dist;
    index index.html;
    ssl_certificate /etc/ssl/example/admin/fullchain.pem;
    ssl_certificate_key /etc/ssl/example/admin/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}

server {
    listen 443 ssl http2;
    server_name shop.example.com;
    root /var/www/ciinlv-pos/marketplace-frontend/dist;
    index index.html;
    ssl_certificate /etc/ssl/example/shop/fullchain.pem;
    ssl_certificate_key /etc/ssl/example/shop/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
